name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore src/WpfToolsMcp.Tool/WpfToolsMcp.Tool.csproj
          dotnet restore tests/WpfToolsMcp.SnapshotTests/WpfToolsMcp.SnapshotTests.csproj

      - name: Build Snoop payloads
        run: pwsh scripts/build-snoop.ps1 -Configuration Release

      - name: Build
        run: dotnet build src/WpfToolsMcp.Tool/WpfToolsMcp.Tool.csproj -c Release --no-restore

      - name: Test
        env:
          RUNNER_ENVIRONMENT: "github-hosted"
          WPF_TOOLS_MCP_RUN_UNHANDLED_CRASH_FIXTURE: "1"
        run: dotnet test tests/WpfToolsMcp.SnapshotTests/WpfToolsMcp.SnapshotTests.csproj -c Release --no-restore
