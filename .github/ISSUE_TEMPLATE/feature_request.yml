name: Feature request
description: Propose a focused improvement to WPF Tools MCP
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem and the observable result you need.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow is blocked, slow, or difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what the tool or server should do from a user's perspective.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Core inspection
        - Interaction and input
        - Diagnostics and observability
        - Agent and injection
        - UI Automation and windowing
        - Packaging and installation
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: What have you tried, and why is it insufficient?

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List concrete outcomes that would make this request complete.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Add a real workflow, sample MCP call, screenshot, trace, or link if available.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation.
          required: true
